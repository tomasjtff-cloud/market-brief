[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFontWeights = [700, 700, 650, 650, 600, 600]
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap"
baseRadius = "0.6rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#2457D6"
backgroundColor = "#F4F6F9"
secondaryBackgroundColor = "#E8ECF2"
textColor = "#13202F"
linkColor = "#2457D6"
borderColor = "#DCE2EA"
greenColor = "#0E8A3E"
redColor = "#C8362F"

[theme.dark]
primaryColor = "#6E9BFF"
backgroundColor = "#0B0C0F"
secondaryBackgroundColor = "#1A1D23"
textColor = "#F2F4F7"
linkColor = "#93B4FF"
borderColor = "#262A32"
greenColor = "#4ADE80"
redColor = "#F87171"

[theme.sidebar]
backgroundColor = "#0F1C2E"
secondaryBackgroundColor = "#1A2B42"
textColor = "#E6ECF3"
borderColor = "#2A3C55"
primaryColor = "#7FA6FF"

[client]
toolbarMode = "minimal"
